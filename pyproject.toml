[project]
name = "composition-oriented-development-pattern"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiodataloader==0.4.0",
    "aiosqlite==0.21.0",
    "click==8.1.7",
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "SQLAlchemy==2.0.43",
    "uvicorn==0.35.0",
    "greenlet==3.2.4",
    "fastapi-voyager==0.27.0",
    "pydantic-resolve[mcp]==5.6.0",
]

[project.optional-dependencies]
benchmark = [
    "strawberry-graphql[fastapi]>=0.287.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
asyncio_mode = "auto"
